<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rubik's cube">
  <rect width="64" height="64" rx="13" fill="#0b0b0f"/>
  <!-- TOP face (white) -->
  <g transform="matrix(0.866,0.5,-0.866,0.5,32,8)" fill="#f5f4ef">
    <rect x="1" y="1" width="6" height="6" rx="1.1"/>
    <rect x="8" y="1" width="6" height="6" rx="1.1"/>
    <rect x="15" y="1" width="6" height="6" rx="1.1"/>
    <rect x="1" y="8" width="6" height="6" rx="1.1"/>
    <rect x="8" y="8" width="6" height="6" rx="1.1"/>
    <rect x="15" y="8" width="6" height="6" rx="1.1"/>
    <rect x="1" y="15" width="6" height="6" rx="1.1"/>
    <rect x="8" y="15" width="6" height="6" rx="1.1"/>
    <rect x="15" y="15" width="6" height="6" rx="1.1"/>
  </g>
  <!-- LEFT face (red) -->
  <g transform="matrix(0.866,0.5,0,1,13,19)" fill="#e01818">
    <rect x="1" y="1" width="6" height="6" rx="1.1"/>
    <rect x="8" y="1" width="6" height="6" rx="1.1"/>
    <rect x="15" y="1" width="6" height="6" rx="1.1"/>
    <rect x="1" y="8" width="6" height="6" rx="1.1"/>
    <rect x="8" y="8" width="6" height="6" rx="1.1"/>
    <rect x="15" y="8" width="6" height="6" rx="1.1"/>
    <rect x="1" y="15" width="6" height="6" rx="1.1"/>
    <rect x="8" y="15" width="6" height="6" rx="1.1"/>
    <rect x="15" y="15" width="6" height="6" rx="1.1"/>
  </g>
  <!-- RIGHT face (blue) -->
  <g transform="matrix(-0.866,0.5,0,1,51,19)" fill="#1466dc">
    <rect x="1" y="1" width="6" height="6" rx="1.1"/>
    <rect x="8" y="1" width="6" height="6" rx="1.1"/>
    <rect x="15" y="1" width="6" height="6" rx="1.1"/>
    <rect x="1" y="8" width="6" height="6" rx="1.1"/>
    <rect x="8" y="8" width="6" height="6" rx="1.1"/>
    <rect x="15" y="8" width="6" height="6" rx="1.1"/>
    <rect x="1" y="15" width="6" height="6" rx="1.1"/>
    <rect x="8" y="15" width="6" height="6" rx="1.1"/>
    <rect x="15" y="15" width="6" height="6" rx="1.1"/>
  </g>
</svg>
